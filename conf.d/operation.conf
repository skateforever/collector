# Operation — collector runtime plumbing: banner colors, dates, output
# paths, results DB, app-report dashboard, cloudflare tunnel. Nothing here
# is per-tool behavior (see functions.conf for that) or a secret (see
# apis-recon.conf / apis-emails.conf).
#
# No variable here depends on another (unlike functions.conf), so both
# the sections below and the variables within each section are in plain
# alphabetical order.

# app-report
# app-report (Flask + HTMX) — port and runtime files live under
# app-report/run/ (sibling to app-report/db/, the cross-run SQLite
# results DB) — app-report is a tool-level, long-lived process, not a
# per-scan artifact, so it doesn't belong under outputs/. One shared
# pidfile/logfile for BOTH launch modes (backgrounded at the tail of a
# recon when -ru|--report-up accompanies it, or foreground when
# -ru|--report-up is passed alone) — see functions/app_report.sh for why
# that's correct (and what it buys: --report-down can stop either one).
# The dashboard never starts unless -ru|--report-up was explicitly
# passed — see the report_up_check gate in run_app_report(). start_app_report()
# treats the PID file as the source of truth: if the process is alive,
# the function is a no-op so multiple recon runs don't fight over the
# socket. Whether the dashboard runs at all is controlled solely by
# -ru|--report-up — there is no separate enable/disable switch here.
app_report_dir="app-report"
# What the operator actually types into their browser, AND the address
# collector-docker publishes the dashboard on — i.e. the `-p` flag's
# host-side half (`docker run -p <this>:<app_report_host_port or
# app_report_container_port>:<app_report_container_port>`).
# This is the ONE variable that controls "can another machine reach the
# dashboard": defaults to 127.0.0.1 (reachable only from the machine
# running collector); set to that machine's LAN/public IP, or 0.0.0.0 to
# publish on every interface, to reach it from elsewhere. Every
# "dashboard is up" message prints THIS, never
# app_report_container_address below, so the operator is never
# told to open 0.0.0.0 in a browser (that was a real bug here before
# this variable existed) — and the printed URL stays accurate
# automatically, with no second variable to keep in sync. collector-docker
# reads this file directly (same precedence pattern as notify_config/
# ALERT_PROVIDER_TYPE — see its own header comment); the
# APP_REPORT_HOST_ADDRESS environment variable overrides it for a single
# invocation without editing this file.
app_report_host_address="0.0.0.0"
# Host-side port collector-docker publishes the dashboard on. Defaults
# to the same value as app_report_container_port below (the common
# case — one less value to keep in sync); change it only if the
# externally-published port needs to differ from gunicorn's own
# container-internal port. Same override pattern as
# app_report_host_address: APP_REPORT_HOST_PORT environment variable
# wins when set.
app_report_host_port="8001"
# 0.0.0.0, not 127.0.0.1: gunicorn runs inside the Docker container's own
# network namespace, where 127.0.0.1 is the CONTAINER's own loopback —
# an address with no meaning to anything outside that namespace, "host"
# or otherwise. `docker run -p <app_report_host_address>:8000:8000`
# forwards traffic arriving at the machine running the container to the
# container's eth0, never to its loopback — so a 127.0.0.1 bind here is
# unreachable no matter how correctly the port is published (confirmed:
# `docker exec ... curl 127.0.0.1:8000` succeeds while `curl` against
# the same mapped port from outside the container gets "Empty reply from
# server"). This doesn't widen actual exposure: reachability from
# outside the container is gated entirely by app_report_host_address
# above (what -p actually publishes to), not by this container-internal
# bind address. Changing THIS variable does nothing for "can another
# machine reach the dashboard" — that's app_report_host_address's job.
app_report_container_address="0.0.0.0"
app_report_container_port="8000"
app_report_logfile_name="app-report.log"
app_report_pidfile_name="app-report.pid"

# cloudflare
# Cloudflare quick-tunnel (trycloudflare.com) — opt-in. When set to "yes",
# start_app_report() launches `cloudflared tunnel --url http://localhost:${app_report_container_port}`
# alongside gunicorn so the dashboard is reachable through an ephemeral
# https://*.trycloudflare.com URL without exposing the VPS IP/port. The
# generated URL is parsed from the cloudflared log and echoed to the
# console at the end of the run. Setting "no" keeps the legacy behavior
# (gunicorn only, accessible via
# app_report_container_address:app_report_container_port).
#
# The tunnel uses its own PID file so concurrent runs share a single
# tunnel just like they share a single gunicorn. start_app_report is a
# no-op when the existing PID is alive.
cloudflare_tunnel="no"
cloudflare_tunnel_logfile_name=".cloudflared.log"
cloudflare_tunnel_pidfile_name=".cloudflared.pid"
# How long (seconds) start_app_report waits for cloudflared to print the
# trycloudflare URL into its log before giving up and warning the user.
cloudflare_tunnel_url_timeout="30"

# colours
green="\e[32m"
red="\e[31m"
reset="\e[0m"
yellow="\e[33m"

# database
# SQLite results store fed by db_usage(). The DB file is the canonical
# datasource for the app-report Flask UI; both the ingestion function
# and the web app read these variables, so keep them in sync.
#
# Lives under app-report/db/ — the Flask app's own directory — instead of
# output_dir, so it's on its own dedicated volume (APP_REPORT_DB_DIR in
# collector-docker / docker-compose.yaml) rather than riding along with
# per-run recon outputs. collector_db_name is just the filename;
# collector_db is the resolved absolute path db_usage/start_app_report
# actually use — override collector_db directly to pin a custom location.
collector_db_name="collector-results"
collector_db="${collector_path}/${app_report_dir:-app-report}/db/${collector_db_name}"
collector_db_schema="${collector_path}/support/runtime/schema/collector-results.sql"

# dates
date_recon=$(date +%Y%m%d)
# ISO date + timestamp — fed into ${domain}_history.csv for DB ingestion.
run_date=$(date +%Y-%m-%d)
started_at=$(date +"%Y-%m-%dT%H:%M:%S%z")

# letters
# stderr is redirected because tput complains ('No value for $TERM and no -T
# specified') when the collector runs without a tty — which is exactly what
# `docker run` without -t does, so every invocation of collector-docker was
# printing two warnings before the banner. The variables themselves stay
# defined (as empty strings when tput fails) so anything that later wants
# to use them doesn't break.
bold=$(tput bold 2>/dev/null)
normal=$(tput sgr0 2>/dev/null)

# output
# Pinned to /opt/collector/outputs because the collector runs exclusively
# inside the Docker container, and /opt/collector/outputs is the canonical
# mount point (see Dockerfile VOLUME directive). The Dockerfile rewrites
# this line at build time (`RUN sed -i 's|^output_dir=.*|...'`) but we
# keep the same value as the source default so this file is also correct
# when read outside the build context (e.g. for tooling that parses it).
# The -o/--output CLI flag was removed in favor of host-side `-v` mounts
# (collector-docker / docker run -v <host>:/opt/collector/outputs).
output_dir="/opt/collector/outputs"

# runtime assets
# Files the collector reads on every run. Each path is built with
# ${collector_path} as the prefix so callers read them as already-absolute
# paths. Point any one of these at a different file by editing the value
# below (e.g. a host-mounted custom user-agents list).
#
# collector_vhost_probe_words has NO default here — unlike the others,
# it's CLI-only, set exclusively by -vpw|--vhost-probe-wordlist (same
# pattern as webapp_wordlists/-ww and dns_wordlists/-s: no config
# fallback, so what wordlist gets used is always explicit at the command
# line, never a silently-applied default that could differ across
# machines/configs). check_parameter_dependency() in check_execution.sh
# requires it whenever -vp|--vhost-probe is passed.
collector_js_api_extractor="${collector_path}/support/runtime/scripts/js_api_extractor.py"
collector_js_deobfuscator="${collector_path}/support/runtime/scripts/js_deobfuscator.py"
collector_llm_header="${collector_path}/support/runtime/prompts/llm-header.txt"
collector_params_patterns="${collector_path}/support/runtime/patterns/params.txt"
collector_secrets_patterns="${collector_path}/support/runtime/patterns/secrets.txt"
collector_takeover_fingerprints="${collector_path}/support/runtime/wordlists/takeover-fingerprints.txt"
collector_user_agents="${collector_path}/support/runtime/wordlists/user-agents.txt"
