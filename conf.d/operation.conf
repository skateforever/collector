# Operation — collector runtime plumbing: banner colors, dates, output
# paths, results DB, app-report dashboard, cloudflare tunnel. Nothing here
# is per-tool behavior (see functions.conf for that) or a secret (see
# apis-recon.conf / apis-emails.conf).

# Colours
red="\e[31m"
green="\e[32m"
yellow="\e[33m"
reset="\e[0m"

# Letters
# stderr is redirected because tput complains ('No value for $TERM and no -T
# specified') when the collector runs without a tty — which is exactly what
# `docker run` without -t does, so every invocation of collector-docker was
# printing two warnings before the banner. The variables themselves stay
# defined (as empty strings when tput fails) so anything that later wants
# to use them doesn't break.
bold=$(tput bold 2>/dev/null)
normal=$(tput sgr0 2>/dev/null)

# Get date
date_recon=$(date +%Y%m%d)
# ISO date + timestamp — fed into ${domain}_history.csv for DB ingestion.
run_date=$(date +%Y-%m-%d)
started_at=$(date +"%Y-%m-%dT%H:%M:%S%z")

# output dir
# Pinned to /opt/collector/outputs because the collector runs exclusively
# inside the Docker container, and /opt/collector/outputs is the canonical
# mount point (see Dockerfile VOLUME directive). The Dockerfile rewrites
# this line at build time (`RUN sed -i 's|^output_dir=.*|...'`) but we
# keep the same value as the source default so this file is also correct
# when read outside the build context (e.g. for tooling that parses it).
# The -o/--output CLI flag was removed in favor of host-side `-v` mounts
# (collector-docker / docker run -v <host>:/opt/collector/outputs).
output_dir="/opt/collector/outputs"

# SQLite results store fed by db_usage(). The DB file is the canonical
# datasource for the app-report Flask UI; both the ingestion function
# and the web app read these variables, so keep them in sync.
#
# These are *names*, not pre-evaluated absolute paths. db_usage and
# start_app_report resolve the final path against ${output_dir} at
# call time. Override `collector_db` directly to pin a custom location.
collector_db_name="collector-results-db"
collector_db_schema="${collector_path}/support/runtime/schema/collector-results.sql"

# Runtime asset paths — files the collector reads on every run. Each path
# is built with ${collector_path} as the prefix so callers read them as
# already-absolute paths. Point any one of these at a different file by
# editing the value below (e.g. a host-mounted custom user-agents list).
collector_user_agents="${collector_path}/support/runtime/wordlists/user-agents.txt"
collector_vhost_probe_words="${collector_path}/support/runtime/wordlists/vhost-probe-names.txt"
collector_takeover_fingerprints="${collector_path}/support/runtime/wordlists/takeover-fingerprints.txt"
collector_secrets_patterns="${collector_path}/support/runtime/patterns/secrets.txt"
collector_params_patterns="${collector_path}/support/runtime/patterns/params.txt"
collector_llm_header="${collector_path}/support/runtime/prompts/llm-header.txt"

# app-report (Flask + HTMX) — port and runtime files. start_app_report()
# treats the PID file as the source of truth: if the process is alive,
# the function is a no-op so multiple recon runs don't fight over the
# socket. The pidfile/logfile names are joined with ${output_dir} at call
# time. Set `app_report_enabled=no` to skip the launcher entirely.
app_report_enabled="yes"
app_report_dir="app-report"
app_report_port="8000"
app_report_host="127.0.0.1"
app_report_pidfile_name=".app-report.pid"
app_report_logfile_name=".app-report.log"

# Cloudflare quick-tunnel (trycloudflare.com) — opt-in. When set to "yes",
# start_app_report() launches `cloudflared tunnel --url http://localhost:${app_report_port}`
# alongside gunicorn so the dashboard is reachable through an ephemeral
# https://*.trycloudflare.com URL without exposing the VPS IP/port. The
# generated URL is parsed from the cloudflared log and echoed to the
# console at the end of the run. Setting "no" keeps the legacy behavior
# (gunicorn only, accessible via app_report_host:app_report_port).
#
# The tunnel uses its own PID file so concurrent runs share a single
# tunnel just like they share a single gunicorn. start_app_report is a
# no-op when the existing PID is alive.
cloudflare_tunnel="no"
cloudflare_tunnel_pidfile_name=".cloudflared.pid"
cloudflare_tunnel_logfile_name=".cloudflared.log"
# How long (seconds) start_app_report waits for cloudflared to print the
# trycloudflare URL into its log before giving up and warning the user.
cloudflare_tunnel_url_timeout="30"
