services:
  collector:
    image: collector:latest
    build:
      context: .
      dockerfile: Dockerfile
    # Bind-mount paths are relative to the repo so 'docker compose run'
    # works on a fresh clone with no sudo and no pre-created directories.
    # The host-side ./outputs and ./wordlists directories are created
    # automatically by Docker on first run; ./conf.d, ./app-report/db and
    # ./app-report/run already exist in the repo (operation.conf/
    # functions.conf tracked; apis-recon.conf and apis-emails.conf are
    # gitignored — copy their *.conf.example templates if you want to fill
    # in real API keys, collector runs fine without them; app-report/db
    # and app-report/run are tracked as empty dirs via .gitkeep, see
    # .gitignore).
    #
    # app-report/db and app-report/run are mounted onto themselves — the
    # SAME repo-relative path on both host and container sides, no
    # separate/aliased directory name — since app-report is a tool-level,
    # long-lived process (its DB and pidfile/logfile aren't per-run recon
    # output), not because it needs a *different* host location. Override
    # to move them elsewhere via .env if you do want a different host path:
    #   OUTPUTS_DIR=/data/recon/outputs
    #   WORDLISTS_DIR=/data/wordlists
    #   APP_REPORT_DB_DIR=/data/app-report/db
    #   APP_REPORT_RUN_DIR=/data/app-report/run
    #   CONF_D_DIR=/opt/collector/conf.d
    #   ALERT_PROVIDER=/opt/collector/support/templates/alerts-notify/discord-provider.yaml
    #
    # The ALERT_PROVIDER mount is optional — if you want to use a custom alert
    # provider config from outside the repo, bind-mount it onto the default path
    # inside the container. If not mounted, collector uses the templates at
    # /opt/collector/support/templates/alerts-notify/{discord,slack,teams,telegram,signal}-provider.yaml.
    volumes:
      - ${OUTPUTS_DIR:-./outputs}:/opt/collector/outputs
      - ${WORDLISTS_DIR:-./wordlists}:/opt/collector/wordlists
      - ${APP_REPORT_DB_DIR:-./app-report/db}:/opt/collector/app-report/db
      - ${APP_REPORT_RUN_DIR:-./app-report/run}:/opt/collector/app-report/run
      - ${CONF_D_DIR:-./conf.d}:/opt/collector/conf.d:ro
    ports:
      - "127.0.0.1:8000:8000"

# Usage:
#   # collector exits with usage() when called without args, so 'up' is
#   # NOT the right verb here — use 'run --rm' and pass collector flags:
#   docker compose run --rm collector -d example.com --recon --webapp-discovery --webapp-short-detection
#   docker compose run --rm collector -dl /opt/collector/outputs/targets.list --recon --webapp-discovery --webapp-short-detection
#   docker compose run --rm collector --help
#
# First-time bootstrap:
#   docker compose --progress=plain build   # builds collector:latest from Dockerfile
#   # --progress is a top-level `docker compose` flag (goes before the
#   # subcommand). plain logs every step as it starts instead of an
#   # interactive spinner — makes a stuck build diagnosable.
#   # ./outputs and ./wordlists are created automatically on first run;
#   # ./app-report/db and ./app-report/run already exist in the repo.
#   # Drop your wordlists into ./wordlists before passing -ww/--webapp-wordlists.
